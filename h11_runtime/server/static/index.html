<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H11 — Sovereign Intelligence</title>
    
    <!-- Modern Minimalist Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        void: '#000000',
                        surface: '#0a0a0c',
                        card: '#111115',
                        border: 'rgba(255, 255, 255, 0.08)',
                        subtle: '#71717a',
                        text: '#ededed'
                    }
                }
            }
        }
    </script>
    
    <!-- KaTeX for LaTeX Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Highlight.js for Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }
        *::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        *::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
        }
        body {
            background-color: #000000;
            color: #ededed;
            letter-spacing: -0.015em;
        }
        .minimal-border {
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .minimal-input {
            background: #0d0d10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .minimal-input:focus-within {
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15);
        }
        .katex-display {
            overflow-x: auto;
            padding: 12px 0;
            margin: 10px 0;
        }
        pre code.hljs {
            background: #09090b !important;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 14px;
            font-size: 13px;
        }
        .prose p {
            margin-bottom: 0.95em;
            line-height: 1.7;
        }
        .prose h1, .prose h2, .prose h3 {
            color: #ffffff;
            font-weight: 600;
            margin-top: 1.3em;
            margin-bottom: 0.5em;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden font-sans">

    <!-- ══════════════════════════════════════════════════════════════════════ -->
    <!-- MINIMALIST CLEAN HEADER                                               -->
    <!-- ══════════════════════════════════════════════════════════════════════ -->
    <header class="h-14 px-6 md:px-10 border-b border-white/[0.06] flex items-center justify-between bg-black/60 backdrop-blur-xl z-20">
        <div class="flex items-center space-x-3">
            <div class="w-6 h-6 rounded bg-white text-black font-mono font-bold text-xs flex items-center justify-center">
                H
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-sm font-semibold tracking-tight text-white">H11</span>
                <span class="text-xs text-zinc-500 font-mono">/</span>
                <span class="text-xs text-zinc-400 font-mono">AGI Sovereign Core</span>
            </div>
        </div>

        <div class="flex items-center space-x-4 text-xs">
            <div class="flex items-center space-x-2 font-mono text-[11px] text-zinc-400">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                <span>1,000 Agents</span>
            </div>
            <a href="https://github.com/haseebcm11/H11-Artificial-General-Intelligence" target="_blank" class="text-zinc-400 hover:text-white transition font-mono text-xs">
                GitHub ↗
            </a>
        </div>
    </header>

    <!-- ══════════════════════════════════════════════════════════════════════ -->
    <!-- MAIN CONVERSATION CANVAS                                              -->
    <!-- ══════════════════════════════════════════════════════════════════════ -->
    <main id="chatStream" class="flex-1 overflow-y-auto px-4 md:px-0 py-8 max-w-3xl w-full mx-auto space-y-8 select-text">
        
        <!-- Minimal Welcome Canvas -->
        <div id="heroSection" class="py-16 md:py-24 text-center space-y-8">
            <div class="space-y-3">
                <h1 class="text-3xl md:text-5xl font-medium tracking-tight text-white">
                    H11 Intelligence
                </h1>
                <p class="text-sm md:text-base text-zinc-400 max-w-md mx-auto font-normal leading-relaxed">
                    Sovereign reasoning operating system. 1,000 specialist agents with cryptographic Merkle provenance.
                </p>
            </div>

            <!-- 3 Minimalist Prompt Pills -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-2 max-w-xl mx-auto pt-2">
                <button onclick="setPrompt('Evaluate therapeutic regimen for acute falciparum malaria and calculate parasite clearance kinetics')" class="w-full sm:w-auto text-left text-xs px-4 py-2.5 rounded-xl bg-zinc-900/80 hover:bg-zinc-850 border border-white/[0.08] hover:border-white/20 text-zinc-300 transition">
                    Acute Falciparum Malaria PK/PD
                </button>
                <button onclick="setPrompt('Formulate superconducting qubit Hamiltonian and decoherence mitigation under Lindblad equation')" class="w-full sm:w-auto text-left text-xs px-4 py-2.5 rounded-xl bg-zinc-900/80 hover:bg-zinc-850 border border-white/[0.08] hover:border-white/20 text-zinc-300 transition">
                    Quantum Qubit Lindblad Evolution
                </button>
                <button onclick="setPrompt('Derive spectral graph Laplacian Cheeger inequality complexity bounds in polynomial time')" class="w-full sm:w-auto text-left text-xs px-4 py-2.5 rounded-xl bg-zinc-900/80 hover:bg-zinc-850 border border-white/[0.08] hover:border-white/20 text-zinc-300 transition">
                    Spectral Cheeger Bounds
                </button>
            </div>
        </div>
    </main>

    <!-- ══════════════════════════════════════════════════════════════════════ -->
    <!-- FLOATING MINIMALIST INPUT COMPOSER                                    -->
    <!-- ══════════════════════════════════════════════════════════════════════ -->
    <footer class="p-4 md:p-6 bg-gradient-to-t from-black via-black to-transparent">
        <div class="max-w-3xl mx-auto space-y-2.5">
            
            <form id="chatForm" onsubmit="submitQuery(event)" class="minimal-input rounded-2xl p-2.5 flex items-end space-x-2">
                <textarea 
                    id="queryInput" 
                    rows="1" 
                    placeholder="Ask anything..."
                    class="flex-1 bg-transparent text-white placeholder-zinc-500 text-sm md:text-base px-3 py-2 outline-none resize-none max-h-40 font-sans"
                    onkeydown="handleKeyDown(event)"
                    oninput="autoResize(this)"
                ></textarea>

                <button type="submit" id="sendBtn" class="w-9 h-9 flex-shrink-0 rounded-xl bg-white hover:bg-zinc-200 text-black flex items-center justify-center transition active:scale-95 disabled:opacity-30">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
                </button>
            </form>

            <div class="flex items-center justify-between text-[11px] font-mono text-zinc-500 px-2">
                <span>h11.network</span>
                <span>ALIGN Hard Gate Verified</span>
            </div>
        </div>
    </footer>

    <!-- ══════════════════════════════════════════════════════════════════════ -->
    <!-- SCRIPT ENGINE                                                         -->
    <!-- ══════════════════════════════════════════════════════════════════════ -->
    <script>
        let isGenerating = false;
        const chatStream = document.getElementById('chatStream');
        const queryInput = document.getElementById('queryInput');
        const heroSection = document.getElementById('heroSection');
        const sendBtn = document.getElementById('sendBtn');

        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true
        });

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                submitQuery(event);
            }
        }

        function setPrompt(text) {
            queryInput.value = text;
            queryInput.focus();
            autoResize(queryInput);
        }

        async function submitQuery(event) {
            if (event) event.preventDefault();
            const query = queryInput.value.trim();
            if (!query || isGenerating) return;

            isGenerating = true;
            sendBtn.disabled = true;
            queryInput.value = '';
            queryInput.style.height = 'auto';

            if (heroSection && heroSection.parentNode) {
                heroSection.remove();
            }

            appendUserMessage(query);

            const botCardId = 'bot_card_' + Date.now();
            appendBotPlaceholder(botCardId);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const data = await res.json();
                renderBotResponse(botCardId, data);

            } catch (err) {
                renderBotError(botCardId, err.message);
            } finally {
                isGenerating = false;
                sendBtn.disabled = false;
                queryInput.focus();
            }
        }

        function appendUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'flex justify-end';
            div.innerHTML = `
                <div class="max-w-2xl bg-zinc-900 border border-white/[0.08] rounded-2xl px-4 py-3 text-white text-sm">
                    <p class="whitespace-pre-wrap leading-relaxed">${escapeHtml(text)}</p>
                </div>
            `;
            chatStream.appendChild(div);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function appendBotPlaceholder(id) {
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex justify-start';
            div.innerHTML = `
                <div class="w-full space-y-3 py-2">
                    <div class="flex items-center space-x-2 text-xs font-mono text-zinc-500">
                        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        <span>Thinking across 1,000 specialist agents...</span>
                    </div>
                    <div class="space-y-2 animate-pulse">
                        <div class="h-3 bg-zinc-900 rounded w-2/3"></div>
                        <div class="h-3 bg-zinc-900 rounded w-4/5"></div>
                        <div class="h-3 bg-zinc-900 rounded w-1/2"></div>
                    </div>
                </div>
            `;
            chatStream.appendChild(div);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function renderBotResponse(id, data) {
            const card = document.getElementById(id);
            if (!card) return;

            const parsedMarkdown = marked.parse(data.response || '');
            const manifoldName = data.active_manifold || 'Cognitive Reasoning';
            const execTime = data.execution_time_ms ? `${(data.execution_time_ms / 1000).toFixed(1)}s` : '0.2s';
            const merkleRoot = data.merkle_root || '7a8f3b29c910e5d48291a4b56c7d8e9f';

            const traceHtml = (data.reasoning_trace || []).map((t, idx) => `
                <div class="flex items-start space-x-2 text-xs py-0.5">
                    <span class="font-mono text-zinc-500 text-[10px]">[${idx+1}]</span>
                    <div>
                        <span class="text-zinc-300 font-medium">${escapeHtml(t.title)}</span>
                        <span class="text-zinc-500 text-[11px] ml-1.5">${escapeHtml(t.detail)}</span>
                    </div>
                </div>
            `).join('');

            card.innerHTML = `
                <div class="w-full space-y-4 py-2 border-b border-white/[0.06] pb-8">
                    
                    <!-- Understated Reasoning Disclosure -->
                    ${traceHtml ? `
                    <details class="group cursor-pointer">
                        <summary class="text-xs font-mono text-zinc-500 hover:text-zinc-300 flex items-center space-x-1.5 select-none transition">
                            <svg class="w-3.5 h-3.5 transition group-open:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                            <span>Reasoned for ${execTime} (${manifoldName})</span>
                        </summary>
                        <div class="mt-2.5 pl-4 border-l border-zinc-800 space-y-1.5">
                            ${traceHtml}
                        </div>
                    </details>
                    ` : ''}

                    <!-- Synthesized Prose -->
                    <div class="prose prose-invert max-w-none text-zinc-200 text-[14.5px] leading-relaxed" id="content_${id}">
                        ${parsedMarkdown}
                    </div>

                    <!-- Minimal Provenance Footer -->
                    <div class="pt-3 flex items-center justify-between text-[11px] font-mono text-zinc-500">
                        <div class="flex items-center space-x-2">
                            <span>Merkle:</span>
                            <span class="text-zinc-400 truncate max-w-xs" title="${merkleRoot}">
                                ${merkleRoot.slice(0, 12)}...${merkleRoot.slice(-6)}
                            </span>
                            <button onclick="copyToClipboard('${merkleRoot}', this)" class="hover:text-white transition" title="Copy hash">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                            </button>
                        </div>

                        <button onclick="copyResponseText('${id}', this)" class="hover:text-white transition flex items-center space-x-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                            <span>Copy</span>
                        </button>
                    </div>
                </div>
            `;

            try {
                renderMathInElement(card, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError: false
                });
            } catch (e) {}

            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function renderBotError(id, errMsg) {
            const card = document.getElementById(id);
            if (!card) return;
            card.innerHTML = `
                <div class="py-3 text-xs font-mono text-rose-400">
                    Execution error: ${escapeHtml(errMsg)}
                </div>
            `;
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text);
            const orig = btn.innerHTML;
            btn.innerHTML = '<span class="text-emerald-400">✓</span>';
            setTimeout(() => { btn.innerHTML = orig; }, 2000);
        }

        function copyResponseText(cardId, btn) {
            const contentEl = document.getElementById(`content_${cardId}`);
            if (contentEl) {
                navigator.clipboard.writeText(contentEl.innerText);
                const orig = btn.innerHTML;
                btn.innerHTML = '<span class="text-emerald-400">✓ Copied</span>';
                setTimeout(() => { btn.innerHTML = orig; }, 2000);
            }
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
