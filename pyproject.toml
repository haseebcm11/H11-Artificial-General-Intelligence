[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h11-agi"
version = "0.1.0"
description = "Governed 1,000 multi-agent artificial general intelligence operating system"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mohamed Haseeb C M" }]
dependencies = [
  "aiohttp>=3.9,<4",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.6,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
search = [
  "beautifulsoup4>=4.12",
  "faiss-cpu>=1.7",
  "lxml>=5.0",
  "sentence-transformers>=3.0",
  "tldextract>=5.0",
  "trafilatura>=1.6",
]
training = [
  "datasets>=2.18",
  "peft>=0.10",
  "torch>=2.2",
  "transformers>=4.40",
  "trl>=0.8",
]
dev = ["pytest>=8,<10"]

[project.scripts]
h11-agi = "h11_runtime.__main__:main"
h11-server = "h11_runtime.server.__main__:main"

[tool.setuptools.packages.find]
include = ["h11_runtime*"]

[tool.setuptools.package-data]
"h11_runtime.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
